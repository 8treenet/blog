<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Inter, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="800" height="640" fill="#fafafa" rx="12"/>

  <!-- Layer 1: Access Layer -->
  <rect x="40" y="30" width="720" height="90" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="60" y="55" font-size="11" font-weight="600" fill="#6366f1" letter-spacing="0.5">ACCESS LAYER</text>
  <rect x="60" y="65" width="150" height="38" rx="6" fill="#fff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="135" y="89" font-size="12" fill="#334155" text-anchor="middle">Web Workbench</text>
  <rect x="225" y="65" width="120" height="38" rx="6" fill="#fff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="285" y="89" font-size="12" fill="#334155" text-anchor="middle">OpenAPI</text>
  <rect x="360" y="65" width="120" height="38" rx="6" fill="#fff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="420" y="89" font-size="12" fill="#334155" text-anchor="middle">SDK</text>
  <rect x="520" y="65" width="220" height="38" rx="6" fill="#fff" stroke="#c7d2fe" stroke-width="1"/>
  <text x="630" y="89" font-size="12" fill="#334155" text-anchor="middle">Team Space · Multi-user · ACL</text>

  <!-- Arrow 1→2 -->
  <path d="M400 120 L400 145" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: Orchestration Layer -->
  <rect x="40" y="150" width="720" height="90" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="60" y="175" font-size="11" font-weight="600" fill="#16a34a" letter-spacing="0.5">ORCHESTRATION LAYER</text>
  <rect x="60" y="185" width="150" height="38" rx="6" fill="#fff" stroke="#bbf7d0" stroke-width="1"/>
  <text x="135" y="209" font-size="12" fill="#334155" text-anchor="middle">Task Planning</text>
  <rect x="225" y="185" width="180" height="38" rx="6" fill="#fff" stroke="#bbf7d0" stroke-width="1"/>
  <text x="315" y="209" font-size="12" fill="#334155" text-anchor="middle">Multi-Agent Scheduling</text>
  <rect x="420" y="185" width="170" height="38" rx="6" fill="#fff" stroke="#bbf7d0" stroke-width="1"/>
  <text x="505" y="209" font-size="12" fill="#334155" text-anchor="middle">Context Engineering</text>
  <rect x="605" y="185" width="135" height="38" rx="6" fill="#fff" stroke="#bbf7d0" stroke-width="1"/>
  <text x="672" y="209" font-size="12" fill="#334155" text-anchor="middle">Session State</text>

  <!-- Arrow 2→3 -->
  <path d="M400 240 L400 265" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: Capability Layer -->
  <rect x="40" y="270" width="720" height="90" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <text x="60" y="295" font-size="11" font-weight="600" fill="#d97706" letter-spacing="0.5">CAPABILITY LAYER</text>
  <rect x="60" y="305" width="155" height="38" rx="6" fill="#fff" stroke="#fde68a" stroke-width="1"/>
  <text x="137" y="329" font-size="12" fill="#334155" text-anchor="middle">Skills / Plugins</text>
  <rect x="230" y="305" width="155" height="38" rx="6" fill="#fff" stroke="#fde68a" stroke-width="1"/>
  <text x="307" y="329" font-size="12" fill="#334155" text-anchor="middle">Knowledge Index</text>
  <rect x="400" y="305" width="155" height="38" rx="6" fill="#fff" stroke="#fde68a" stroke-width="1"/>
  <text x="477" y="329" font-size="12" fill="#334155" text-anchor="middle">Tool Chain (MCP)</text>
  <rect x="570" y="305" width="170" height="38" rx="6" fill="#fff" stroke="#fde68a" stroke-width="1"/>
  <text x="655" y="329" font-size="12" fill="#334155" text-anchor="middle">Secure Sandbox</text>

  <!-- Arrow 3→4 -->
  <path d="M400 360 L400 385" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 4: Model Layer -->
  <rect x="40" y="390" width="720" height="100" rx="10" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5"/>
  <text x="60" y="415" font-size="11" font-weight="600" fill="#db2777" letter-spacing="0.5">MODEL LAYER</text>
  <rect x="60" y="425" width="160" height="38" rx="6" fill="#fff" stroke="#fbcfe8" stroke-width="1"/>
  <text x="140" y="449" font-size="12" fill="#334155" text-anchor="middle">Multi-Model Router</text>
  <rect x="260" y="425" width="100" height="38" rx="6" fill="#fff" stroke="#fbcfe8" stroke-width="1"/>
  <text x="310" y="449" font-size="12" fill="#334155" text-anchor="middle">OpenAI</text>
  <rect x="375" y="425" width="100" height="38" rx="6" fill="#fff" stroke="#fbcfe8" stroke-width="1"/>
  <text x="425" y="449" font-size="12" fill="#334155" text-anchor="middle">Claude</text>
  <rect x="490" y="425" width="100" height="38" rx="6" fill="#fff" stroke="#fbcfe8" stroke-width="1"/>
  <text x="540" y="449" font-size="12" fill="#334155" text-anchor="middle">Qwen</text>
  <rect x="605" y="425" width="100" height="38" rx="6" fill="#fff" stroke="#fbcfe8" stroke-width="1"/>
  <text x="655" y="449" font-size="12" fill="#334155" text-anchor="middle">GLM · ...</text>

  <!-- Arrow 4→5 -->
  <path d="M400 490 L400 515" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 5: Storage Layer -->
  <rect x="40" y="520" width="720" height="90" rx="10" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/>
  <text x="60" y="545" font-size="11" font-weight="600" fill="#0891b2" letter-spacing="0.5">STORAGE LAYER</text>

  <!-- RDBMS group (pick one) -->
  <rect x="55" y="551" width="295" height="46" rx="6" fill="none" stroke="#67e8f9" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="63" y="563" font-size="9" fill="#0891b2">RDBMS · pick one</text>
  <rect x="62" y="567" width="72" height="24" rx="4" fill="#fff" stroke="#a5f3fc" stroke-width="1"/>
  <text x="98" y="583" font-size="11" fill="#334155" text-anchor="middle">MySQL</text>
  <text x="143" y="583" font-size="10" fill="#94a3b8" text-anchor="middle">or</text>
  <rect x="152" y="567" width="88" height="24" rx="4" fill="#fff" stroke="#a5f3fc" stroke-width="1"/>
  <text x="196" y="583" font-size="11" fill="#334155" text-anchor="middle">PostgreSQL</text>
  <text x="249" y="583" font-size="10" fill="#94a3b8" text-anchor="middle">or</text>
  <rect x="258" y="567" width="72" height="24" rx="4" fill="#fff" stroke="#a5f3fc" stroke-width="1"/>
  <text x="294" y="583" font-size="11" fill="#334155" text-anchor="middle">SQLite</text>

  <!-- Cache / State (pick one) -->
  <rect x="362" y="551" width="158" height="46" rx="6" fill="none" stroke="#67e8f9" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="370" y="563" font-size="9" fill="#0891b2">Cache · pick one</text>
  <rect x="369" y="567" width="60" height="24" rx="4" fill="#fff" stroke="#a5f3fc" stroke-width="1"/>
  <text x="399" y="583" font-size="11" fill="#334155" text-anchor="middle">Redis</text>
  <text x="437" y="583" font-size="10" fill="#94a3b8" text-anchor="middle">or</text>
  <rect x="446" y="567" width="66" height="24" rx="4" fill="#fff" stroke="#a5f3fc" stroke-width="1"/>
  <text x="479" y="583" font-size="11" fill="#334155" text-anchor="middle">Memory</text>

  <!-- Vector Store group (pick one) -->
  <rect x="530" y="551" width="218" height="46" rx="6" fill="none" stroke="#67e8f9" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="538" y="563" font-size="9" fill="#0891b2">Vector Store · pick one</text>
  <rect x="537" y="567" width="62" height="24" rx="4" fill="#fff" stroke="#a5f3fc" stroke-width="1"/>
  <text x="568" y="583" font-size="11" fill="#334155" text-anchor="middle">Chroma</text>
  <text x="607" y="583" font-size="10" fill="#94a3b8" text-anchor="middle">or</text>
  <rect x="615" y="567" width="48" height="24" rx="4" fill="#fff" stroke="#a5f3fc" stroke-width="1"/>
  <text x="639" y="583" font-size="11" fill="#334155" text-anchor="middle">ES</text>
  <text x="671" y="583" font-size="10" fill="#94a3b8" text-anchor="middle">or</text>
  <rect x="679" y="567" width="58" height="24" rx="4" fill="#fff" stroke="#a5f3fc" stroke-width="1"/>
  <text x="708" y="583" font-size="11" fill="#334155" text-anchor="middle">Milvus</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1 1 L4 4 L1 7" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>
</svg>
